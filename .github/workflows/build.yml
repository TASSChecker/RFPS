name: Build RFPS Windows x64

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: Configure CMake
        run: |
          cmake -B build -A x64

      - name: Build Release
        run: |
          cmake --build build --config Release

      - name: Deploy Qt DLLs and Package
        run: |
          mkdir RFPS_Release
          copy build\Release\RFPS.exe RFPS_Release\
          xcopy /E /I shaders RFPS_Release\shaders\
          windeployqt.exe RFPS_Release\RFPS.exe --no-translations --no-opengl-sw

      - name: Upload RFPS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RFPS-Windows-x64
          path: RFPS_Release/
